name: Build OAAX ONNX Runtime runtime

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a release upload half way
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-runtimes:
    timeout-minutes: 60
    runs-on: hetzner-runner
    container:
      image: ubuntu:22.04
      options: >-
        --volume ${{ vars.NVIDIA_DEPS_DIR }}:${{ vars.NVIDIA_DEPS_DIR }}

    steps:
      - name: Set up environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git git-lfs wget curl build-essential cmake s3cmd xz-utils patchelf
          git lfs install

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
          submodules: recursive
          lfs: true

      - name: Link pre-cached cuDNN
        run: |
          mkdir -p .deps
          ln -fs ${{ vars.NVIDIA_DEPS_DIR }}/cudnn .deps/cudnn

      - name: Install cross-compilation toolchains
        shell: bash
        run: |
          toolchains=(
            "https://oaax.nbg1.your-objectstorage.com/toolchains/x86_64-unknown-linux-gnu-gcc-9.5.0.tar.gz"
            "https://oaax.nbg1.your-objectstorage.com/toolchains/x86-64-v2--glibc--stable-2022.08-1.tar.bz2"
            "https://oaax.nbg1.your-objectstorage.com/toolchains/gcc-arm-9.2-2019.12-x86_64-aarch64-none-linux-gnu.tar.gz"
            "https://oaax.nbg1.your-objectstorage.com/toolchains/gcc-arm-11.2-2022.02-x86_64-aarch64-none-linux-gnu.tar.xz"
            "https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"
          )
          for url in "${toolchains[@]}"; do
            filename="${url##*/}"
            echo "Downloading: $filename"
            wget -nv "$url" -O "/tmp/$filename"
            tar xf "/tmp/$filename" -C /opt
            rm "/tmp/$filename"
          done

      - name: Build all runtimes
        run: bash onnxruntime/runtime-library/build-runtimes.sh

      - name: Publish to the OAAX bucket
        uses: ./.github/actions/publish
        with:
          set: ort-runtime
          s3-access-key: ${{ secrets.S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.S3_SECRET_KEY }}
          s3-endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}

  build-runtime-windows-x86_64:
    timeout-minutes: 60
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
          submodules: recursive
          lfs: true

      - name: Cache cuDNN downloads
        uses: actions/cache@v4
        with:
          path: .deps\cudnn
          key: cudnn-windows-${{ hashFiles('scripts/download-cudnn.sh') }}

      - name: Compile runtime
        run: |
          cd onnxruntime\runtime-library
          .\build-runtimes.bat

      # Archives go through a GitHub artifact and are published by the Linux job below: s3cmd on the Windows
      # runner did not finish the ~3 GB upload within the job timeout. The tar.gz files do not compress further.
      - name: Upload the runtime archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: runtime-windows-x86_64
          path: onnxruntime/runtime-library/artifacts/runtime-library-X86_64-Windows-cuda_*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish-runtime-windows-x86_64:
    name: Publish the Windows runtime
    timeout-minutes: 30
    needs: build-runtime-windows-x86_64
    runs-on: hetzner-runner
    container:
      image: ubuntu:22.04

    steps:
      - name: Install s3cmd
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y s3cmd

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Download the runtime archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: runtime-windows-x86_64
          path: onnxruntime/runtime-library/artifacts

      - name: Publish to the OAAX bucket
        uses: ./.github/actions/publish
        with:
          set: ort-runtime-windows
          s3-access-key: ${{ secrets.S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.S3_SECRET_KEY }}
          s3-endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
