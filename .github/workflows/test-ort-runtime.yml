name: Test ORT runtime

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-ort:
    # GitHub-hosted runner with an NVIDIA GPU.
    # Adjust this label to match your organization's runner configuration.
    runs-on: ubuntu-22.04-nvidia-t4
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
          lfs: true

      - name: Install system dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y cmake build-essential curl wget xz-utils git-lfs docker.io

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Download cross-compilation toolchain
        run: |
          wget -nv \
            "https://oaax.nbg1.your-objectstorage.com/toolchains/x86_64-unknown-linux-gnu-gcc-9.5.0.tar.gz" \
            -O /tmp/toolchain.tar.gz
          sudo tar xf /tmp/toolchain.tar.gz -C /opt

      - name: Build ORT runtime (X86_64, CUDA 12)
        run: bash onnxruntime/runtime-library/build-runtimes.sh X86_64 12

      - name: Build ORT conversion toolchain Docker image
        run: bash onnxruntime/conversion-toolchain/build-toolchain.sh

      - name: Stage 1 — Convert models (ORT)
        run: uv run python -m tests.stage1 --backend ort

      - name: Stage 2 — Benchmark (ORT)
        run: |
          uv run python -m tests.stage2 \
            --backend ort \
            --runtime-lib onnxruntime/runtime-library/artifacts/X86_64/12 \
            --runs 100 \
            --warmup 10 \
            --log-level 0
