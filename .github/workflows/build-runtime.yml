name: Build OAAX runtime
permissions:
  contents: none

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-runtimes:
    timeout-minutes: 120
    runs-on: hetzner-runner
    container:
      image: ubuntu:22.04
      options: --volume /var/run/docker.sock:/var/run/docker.sock

    strategy:
      matrix:
        cuda_version: ["12", "13"]

    steps:
      - name: Set up Docker image
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git git-lfs
          git lfs install

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Set up environment
        run: bash scripts/setup-env.sh

      - name: Set CUDA paths
        run: |
          if [ "${{ matrix.cuda_version }}" = "12" ]; then
            echo "TRT_DIR_X86=${{ secrets.TRT_DIR_X86_CUDA12 }}" >> $GITHUB_ENV
            echo "TRT_DIR_AARCH64=${{ secrets.TRT_DIR_AARCH64_CUDA12 }}" >> $GITHUB_ENV
            echo "CUDA_ROOT=${{ secrets.CUDA_ROOT_12 }}" >> $GITHUB_ENV
          elif [ "${{ matrix.cuda_version }}" = "13" ]; then
            echo "TRT_DIR_X86=${{ secrets.TRT_DIR_X86_CUDA13 }}" >> $GITHUB_ENV
            echo "TRT_DIR_AARCH64=${{ secrets.TRT_DIR_AARCH64_CUDA13 }}" >> $GITHUB_ENV
            echo "CUDA_ROOT=${{ secrets.CUDA_ROOT_13 }}" >> $GITHUB_ENV
          fi

      - name: Determine version
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            version=$(cat VERSION)
          else
            version=${{ github.head_ref }}
          fi
          echo "version=$version" >> $GITHUB_ENV

      - name: Build X86_64 runtimes
        run: |
          for march in "x86-64" "x86-64-v3" "x86-64-v4"; do
            TRT_DIR=${{ env.TRT_DIR_X86 }} \
            CUDA_DIR=${{ env.CUDA_ROOT }} \
            CUDA_VERSION=${{ matrix.cuda_version }} \
            PLATFORM=X86_64 \
            MARCH=$march \
            bash runtime-library/build-runtimes.sh
          done

      - name: Build AARCH64_GLIBC2_34 runtimes
        run: |
          for march in "armv8-a" "armv8.2-a+fp16+dotprod"; do
            TRT_DIR=${{ env.TRT_DIR_AARCH64 }} \
            CUDA_DIR=${{ env.CUDA_ROOT }}/targets/aarch64-linux \
            CUDA_VERSION=${{ matrix.cuda_version }} \
            PLATFORM=AARCH64_GLIBC2_34 \
            MARCH=$march \
            bash runtime-library/build-runtimes.sh
          done

      - name: Build AARCH64_GLIBC2_38 runtimes
        run: |
          for march in "armv8-a" "armv9-a"; do
            TRT_DIR=${{ env.TRT_DIR_AARCH64 }} \
            CUDA_DIR=${{ env.CUDA_ROOT }}/targets/sbsa-linux \
            CUDA_VERSION=${{ matrix.cuda_version }} \
            PLATFORM=AARCH64_GLIBC2_38 \
            MARCH=$march \
            bash runtime-library/build-runtimes.sh
          done

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          cuda=${{ matrix.cuda_version }}
          pack() {
            local platform=$1 arch=$2 march=$3
            tar czf "artifacts/runtime-${platform}-${march}-cuda${cuda}.tar.gz" \
              -C "runtime-library/build/${platform}/cuda-${cuda}/${march}" bin/
          }
          pack X86_64             x86_64         x86-64
          pack X86_64             x86_64         x86-64-v3
          pack X86_64             x86_64         x86-64-v4
          pack AARCH64_GLIBC2_34  aarch64        armv8-a
          pack AARCH64_GLIBC2_34  aarch64        armv8.2-a+fp16+dotprod
          pack AARCH64_GLIBC2_38  aarch64-server armv8-a
          pack AARCH64_GLIBC2_38  aarch64-server armv9-a

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y s3cmd

      - name: Configure s3cmd
        run: |
          cat > ~/.s3cfg <<EOF
          [default]
          access_key = ${{ secrets.S3_ACCESS_KEY }}
          secret_key = ${{ secrets.S3_SECRET_KEY }}
          bucket_location = us-east-1
          host_base = ${{ secrets.S3_ENDPOINT_URL }}
          host_bucket = %(bucket)s.${{ secrets.S3_ENDPOINT_URL }}
          use_https = True
          EOF

      - name: Upload runtimes to S3
        run: |
          version=${{ env.version }}
          cuda=${{ matrix.cuda_version }}
          upload() {
            local platform=$1 arch=$2 march=$3
            s3cmd put "artifacts/runtime-${platform}-${march}-cuda${cuda}.tar.gz" \
              "s3://oaax/runtimes/${version}/NVIDIA/cuda-${cuda}/${arch}/${march}/Ubuntu/library.tar.gz"
          }
          upload X86_64             x86_64         x86-64
          upload X86_64             x86_64         x86-64-v3
          upload X86_64             x86_64         x86-64-v4
          upload AARCH64_GLIBC2_34  aarch64        armv8-a
          upload AARCH64_GLIBC2_34  aarch64        armv8.2-a+fp16+dotprod
          upload AARCH64_GLIBC2_38  aarch64-server armv8-a
          upload AARCH64_GLIBC2_38  aarch64-server armv9-a
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            s3cmd sync "s3://oaax/runtimes/${version}/NVIDIA/" \
                       "s3://oaax/runtimes/latest/NVIDIA/"
          fi
