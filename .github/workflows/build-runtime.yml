name: Build OAAX runtime
permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a release upload half way
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-runtimes:
    timeout-minutes: 120
    runs-on: hetzner-runner
    container:
      image: ubuntu:22.04
      options: >-
        --volume ${{ vars.NVIDIA_DEPS_DIR }}:${{ vars.NVIDIA_DEPS_DIR }}

    steps:
      - name: Set up environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git git-lfs wget curl build-essential python3 xz-utils zstd s3cmd sudo
          git lfs install

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Link pre-cached deps
        run: ln -fs ${{ vars.NVIDIA_DEPS_DIR }} .deps

      - name: Install env deps
        run: bash scripts/setup-env.sh

      - name: Build all runtimes
        run: |
          bash tensorrt/runtime-library/build-runtimes.sh

      - name: Publish to the OAAX bucket
        uses: ./.github/actions/publish
        with:
          set: trt-runtime
          s3-access-key: ${{ secrets.S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.S3_SECRET_KEY }}
          s3-endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
