name: Build OAAX runtime
permissions:
  contents: none

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-runtimes:
    timeout-minutes: 60
    runs-on: hetzner-runner
    container:
      image: ubuntu:22.04
      options: --volume /var/run/docker.sock:/var/run/docker.sock

    strategy:
      matrix:
        cuda_version: ["12", "13"]

    steps:
      - name: Set up Docker image
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git git-lfs
          git lfs install

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Set up environment
        run: bash scripts/setup-env.sh

      - name: Set CUDA paths
        run: |
          if [ "${{ matrix.cuda_version }}" = "12" ]; then
            echo "TRT_DIR_X86=${{ secrets.TRT_DIR_X86_CUDA12 }}" >> $GITHUB_ENV
            echo "TRT_DIR_AARCH64=${{ secrets.TRT_DIR_AARCH64_CUDA12 }}" >> $GITHUB_ENV
            echo "CUDA_ROOT=${{ secrets.CUDA_ROOT_12 }}" >> $GITHUB_ENV
          elif [ "${{ matrix.cuda_version }}" = "13" ]; then
            echo "TRT_DIR_X86=${{ secrets.TRT_DIR_X86_CUDA13 }}" >> $GITHUB_ENV
            echo "TRT_DIR_AARCH64=${{ secrets.TRT_DIR_AARCH64_CUDA13 }}" >> $GITHUB_ENV
            echo "CUDA_ROOT=${{ secrets.CUDA_ROOT_13 }}" >> $GITHUB_ENV
          fi

      - name: Determine version
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            version=$(cat VERSION)
          else
            version=${{ github.head_ref }}
          fi
          echo "version=$version" >> $GITHUB_ENV

      - name: Build X86_64 runtime
        run: |
          TRT_DIR=${{ env.TRT_DIR_X86 }} \
          CUDA_DIR=${{ env.CUDA_ROOT }} \
          CUDA_VERSION=${{ matrix.cuda_version }} \
          PLATFORM=X86_64 \
          bash runtime-library/build-runtimes.sh

      - name: Build AARCH64_GLIBC2_34 runtime
        run: |
          TRT_DIR=${{ env.TRT_DIR_AARCH64 }} \
          CUDA_DIR=${{ env.CUDA_ROOT }}/targets/aarch64-linux \
          CUDA_VERSION=${{ matrix.cuda_version }} \
          PLATFORM=AARCH64_GLIBC2_34 \
          bash runtime-library/build-runtimes.sh

      - name: Build AARCH64_GLIBC2_38 runtime
        run: |
          TRT_DIR=${{ env.TRT_DIR_AARCH64 }} \
          CUDA_DIR=${{ env.CUDA_ROOT }}/targets/sbsa-linux \
          CUDA_VERSION=${{ matrix.cuda_version }} \
          PLATFORM=AARCH64_GLIBC2_38 \
          bash runtime-library/build-runtimes.sh

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          for platform in X86_64 AARCH64_GLIBC2_34 AARCH64_GLIBC2_38; do
            tar czf "artifacts/runtime-library-${platform}-cuda${{ matrix.cuda_version }}.tar.gz" \
              -C "runtime-library/build/${platform}/cuda-${{ matrix.cuda_version }}" bin/
          done

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y s3cmd

      - name: Configure s3cmd
        run: |
          cat > ~/.s3cfg <<EOF
          [default]
          access_key = ${{ secrets.S3_ACCESS_KEY }}
          secret_key = ${{ secrets.S3_SECRET_KEY }}
          bucket_location = us-east-1
          host_base = ${{ secrets.S3_ENDPOINT_URL }}
          host_bucket = %(bucket)s.${{ secrets.S3_ENDPOINT_URL }}
          use_https = True
          EOF

      - name: Upload runtimes to S3
        run: |
          version=${{ env.version }}
          cuda=${{ matrix.cuda_version }}
          s3cmd put "artifacts/runtime-library-X86_64-cuda${cuda}.tar.gz" \
            "s3://oaax/runtimes/${version}/NVIDIA/cuda-${cuda}/x86_64/Ubuntu/library.tar.gz"
          s3cmd put "artifacts/runtime-library-AARCH64_GLIBC2_34-cuda${cuda}.tar.gz" \
            "s3://oaax/runtimes/${version}/NVIDIA/cuda-${cuda}/aarch64/Ubuntu/library.tar.gz"
          s3cmd put "artifacts/runtime-library-AARCH64_GLIBC2_38-cuda${cuda}.tar.gz" \
            "s3://oaax/runtimes/${version}/NVIDIA/cuda-${cuda}/aarch64-server/Ubuntu/library.tar.gz"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            s3cmd sync "s3://oaax/runtimes/${version}/NVIDIA/" \
                       "s3://oaax/runtimes/latest/NVIDIA/"
          fi
