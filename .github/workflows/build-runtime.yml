name: Build OAAX runtime
permissions:
  contents: none

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-runtimes:
    timeout-minutes: 60
    runs-on: hetzner-runner
    container:
      image: ubuntu:22.04
      options: --volume /var/run/docker.sock:/var/run/docker.sock

    steps:
      - name: Set up Docker image
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git git-lfs
          git lfs install

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Set up environment
        run: bash scripts/setup-env.sh

      - name: Determine version
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            version=$(cat VERSION)
          else
            version=${{ github.head_ref }}
          fi
          echo "version=$version" >> $GITHUB_ENV

      - name: Build X86_64 runtime
        run: |
          TRT_DIR=/opt/TensorRT-x86_64 \
          CUDA_DIR=/usr/local/cuda-13.2 \
          PLATFORM=X86_64 \
          bash runtime-library/build-runtimes.sh

      - name: Build AARCH64 runtime
        run: |
          TRT_DIR=/opt/TensorRT-aarch64 \
          CUDA_DIR=/usr/local/cuda-13.2/targets/aarch64-linux \
          PLATFORM=AARCH64 \
          bash runtime-library/build-runtimes.sh

      - name: Build AARCH64_SERVER runtime
        run: |
          TRT_DIR=/opt/TensorRT-aarch64 \
          CUDA_DIR=/usr/local/cuda-13.2/targets/sbsa-linux \
          PLATFORM=AARCH64_SERVER \
          bash runtime-library/build-runtimes.sh

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          for platform in X86_64 AARCH64 AARCH64_SERVER; do
            tar czf "artifacts/runtime-library-${platform}.tar.gz" \
              -C "runtime-library/build/${platform}" bin/
          done

      - name: Install s3cmd
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y s3cmd

      - name: Configure s3cmd
        run: |
          cat > ~/.s3cfg <<EOF
          [default]
          access_key = ${{ secrets.S3_ACCESS_KEY }}
          secret_key = ${{ secrets.S3_SECRET_KEY }}
          bucket_location = us-east-1
          host_base = ${{ secrets.S3_ENDPOINT_URL }}
          host_bucket = %(bucket)s.${{ secrets.S3_ENDPOINT_URL }}
          use_https = True
          EOF

      - name: Upload runtimes to S3
        run: |
          version=${{ env.version }}
          s3cmd put "artifacts/runtime-library-X86_64.tar.gz" \
            "s3://oaax/runtimes/${version}/NVIDIA/x86_64/Ubuntu/library.tar.gz"
          s3cmd put "artifacts/runtime-library-AARCH64.tar.gz" \
            "s3://oaax/runtimes/${version}/NVIDIA/aarch64/Ubuntu/library.tar.gz"
          s3cmd put "artifacts/runtime-library-AARCH64_SERVER.tar.gz" \
            "s3://oaax/runtimes/${version}/NVIDIA/aarch64-server/Ubuntu/library.tar.gz"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            s3cmd sync "s3://oaax/runtimes/${version}/NVIDIA/" \
                       "s3://oaax/runtimes/latest/NVIDIA/"
          fi
