name: Build OAAX runtime
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-runtimes:
    timeout-minutes: 120
    runs-on: hetzner-runner
    container:
      image: ubuntu:22.04
      options: >-
        --volume /var/run/docker.sock:/var/run/docker.sock
        --volume ${{ vars.NVIDIA_DEPS_DIR }}:${{ vars.NVIDIA_DEPS_DIR }}

    steps:
      - name: Set up Docker image
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git git-lfs wget curl build-essential python3 xz-utils s3cmd tree sudo
          git lfs install

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Link pre-cached deps
        run: ln -fs ${{ vars.NVIDIA_DEPS_DIR }} .deps

      - name: Install env deps
        run: bash scripts/setup-env.sh

      - name: Determine version
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            version=$(cat VERSION)
          else
            version=${{ github.head_ref }}
          fi
          echo "version=$version" >> $GITHUB_ENV

      - name: Build all runtimes
        run: |
          bash tensorrt/runtime-library/build-runtimes.sh

      - name: Configure s3cmd
        run: |
          cat > ~/.s3cfg <<EOF
          [default]
          access_key = ${{ secrets.S3_ACCESS_KEY }}
          secret_key = ${{ secrets.S3_SECRET_KEY }}
          bucket_location = us-east-1
          host_base = ${{ secrets.S3_ENDPOINT_URL }}
          host_bucket = %(bucket)s.${{ secrets.S3_ENDPOINT_URL }}
          use_https = True
          EOF

      - name: Upload runtimes to S3
        run: |
          version=${{ env.version }}
          find tensorrt/runtime-library/build/NVIDIA_TENSORRT -name "library-cuda_*.tar.gz" | while read -r archive; do
            # archive path: tensorrt/runtime-library/build/NVIDIA_TENSORRT/<arch>/Ubuntu/<ubuntu_version>/library-cuda_<N>.tar.gz
            rel="${archive#tensorrt/runtime-library/build/}"
            s3cmd put "$archive" "s3://oaax/runtimes/${version}/${rel}"
          done
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            s3cmd sync "s3://oaax/runtimes/${version}/NVIDIA_TENSORRT/" \
                       "s3://oaax/runtimes/latest/NVIDIA_TENSORRT/"
          fi
