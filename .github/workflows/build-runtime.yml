name: Build OAAX runtime
permissions:
  contents: none

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-runtimes:
    timeout-minutes: 120
    runs-on: hetzner-runner
    container:
      image: ubuntu:22.04
      options: --volume /var/run/docker.sock:/var/run/docker.sock

    steps:
      - name: Set up Docker image
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git git-lfs
          git lfs install

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Populate TensorRT archives
        run: |
          mkdir -p tensorrt-archives
          cp ${{ secrets.TENSORRT_ARCHIVES_DIR }}/*.tar.gz tensorrt-archives/ 2>/dev/null || true

      - name: Set up environment
        run: bash scripts/setup-env.sh

      - name: Determine version
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            version=$(cat VERSION)
          else
            version=${{ github.head_ref }}
          fi
          echo "version=$version" >> $GITHUB_ENV

      - name: Build all runtimes
        run: bash runtime-library/build-runtimes.sh

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          pack() {
            local platform=$1 cuda=$2 march=$3
            tar czf "artifacts/runtime-${platform}-${march}-cuda${cuda}.tar.gz" \
              -C "runtime-library/build/${platform}/cuda-${cuda}/${march}" bin/
          }
          pack X86_64            12 x86-64
          pack X86_64            12 x86-64-v3
          pack X86_64            12 x86-64-v4
          pack X86_64            13 x86-64
          pack X86_64            13 x86-64-v3
          pack X86_64            13 x86-64-v4
          pack AARCH64_GLIBC2_34 12 armv8-a
          pack AARCH64_GLIBC2_34 12 armv8.2-a+fp16+dotprod
          pack AARCH64_GLIBC2_38 12 armv8-a
          pack AARCH64_GLIBC2_38 12 armv9-a
          pack AARCH64_GLIBC2_38 13 armv8-a
          pack AARCH64_GLIBC2_38 13 armv9-a

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y s3cmd

      - name: Configure s3cmd
        run: |
          cat > ~/.s3cfg <<EOF
          [default]
          access_key = ${{ secrets.S3_ACCESS_KEY }}
          secret_key = ${{ secrets.S3_SECRET_KEY }}
          bucket_location = us-east-1
          host_base = ${{ secrets.S3_ENDPOINT_URL }}
          host_bucket = %(bucket)s.${{ secrets.S3_ENDPOINT_URL }}
          use_https = True
          EOF

      - name: Upload runtimes to S3
        run: |
          version=${{ env.version }}
          upload() {
            local platform=$1 cuda=$2 arch=$3 march=$4 libc=$5
            s3cmd put "artifacts/runtime-${platform}-${march}-cuda${cuda}.tar.gz" \
              "s3://oaax/runtimes/${version}/NVIDIA/${arch}/${march}/Ubuntu/${libc}/library-cuda_${cuda}.tar.gz"
          }
          upload X86_64            12 x86_64  x86-64                 glibc2.35
          upload X86_64            12 x86_64  x86-64-v3              glibc2.35
          upload X86_64            12 x86_64  x86-64-v4              glibc2.35
          upload X86_64            13 x86_64  x86-64                 glibc2.35
          upload X86_64            13 x86_64  x86-64-v3              glibc2.35
          upload X86_64            13 x86_64  x86-64-v4              glibc2.35
          upload AARCH64_GLIBC2_34 12 aarch64 armv8-a                glibc2.34
          upload AARCH64_GLIBC2_34 12 aarch64 armv8.2-a+fp16+dotprod glibc2.34
          upload AARCH64_GLIBC2_38 12 aarch64 armv8-a                glibc2.38
          upload AARCH64_GLIBC2_38 12 aarch64 armv9-a                glibc2.38
          upload AARCH64_GLIBC2_38 13 aarch64 armv8-a                glibc2.38
          upload AARCH64_GLIBC2_38 13 aarch64 armv9-a                glibc2.38
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            s3cmd sync "s3://oaax/runtimes/${version}/NVIDIA/" \
                       "s3://oaax/runtimes/latest/NVIDIA/"
          fi
