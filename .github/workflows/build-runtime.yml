name: Build OAAX runtime
permissions:
  contents: none

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-runtimes:
    timeout-minutes: 120
    runs-on: hetzner-runner
    container:
      image: ubuntu:22.04
      options: >-
        --volume /var/run/docker.sock:/var/run/docker.sock
        --volume ${{ secrets.DEPS_DIR }}:${{ secrets.DEPS_DIR }}

    steps:
      - name: Set up Docker image
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git git-lfs wget curl build-essential python3 xz-utils s3cmd
          git lfs install

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Install CMake
        run: |
          if ! command -v cmake &>/dev/null || [ "$(cmake --version | head -1 | awk '{print $3}')" \< "3.14" ]; then
            host_platform=$(uname -m)
            wget -q "https://cmake.org/files/v3.31/cmake-3.31.7-linux-${host_platform}.sh" -O /tmp/cmake-install.sh
            chmod u+x /tmp/cmake-install.sh
            mkdir -p /opt/cmake-3.31.7
            /tmp/cmake-install.sh --skip-license --prefix=/opt/cmake-3.31.7
            rm /tmp/cmake-install.sh
            ln -fs /opt/cmake-3.31.7/bin/* /usr/local/bin
          fi

      - name: Link pre-cached deps
        run: ln -s ${{ secrets.DEPS_DIR }} .deps

      - name: Determine version
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            version=$(cat VERSION)
          else
            version=${{ github.head_ref }}
          fi
          echo "version=$version" >> $GITHUB_ENV

      - name: Build all runtimes
        run: bash runtime-library/build-runtimes.sh

      - name: Configure s3cmd
        run: |
          cat > ~/.s3cfg <<EOF
          [default]
          access_key = ${{ secrets.S3_ACCESS_KEY }}
          secret_key = ${{ secrets.S3_SECRET_KEY }}
          bucket_location = us-east-1
          host_base = ${{ secrets.S3_ENDPOINT_URL }}
          host_bucket = %(bucket)s.${{ secrets.S3_ENDPOINT_URL }}
          use_https = True
          EOF

      - name: Upload runtimes to S3
        run: |
          version=${{ env.version }}
          find runtime-library/build/NVIDIA -name "library-cuda_*.tar.gz" | while read -r archive; do
            # archive path: runtime-library/build/NVIDIA/<arch>/<march>/Ubuntu/<libc>/library-cuda_<N>.tar.gz
            rel="${archive#runtime-library/build/}"
            s3cmd put "$archive" "s3://oaax/runtimes/${version}/${rel}"
          done
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            s3cmd sync "s3://oaax/runtimes/${version}/NVIDIA/" \
                       "s3://oaax/runtimes/latest/NVIDIA/"
          fi
