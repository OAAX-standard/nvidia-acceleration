name: Build OAAX ONNX Runtime conversion toolchain

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a release upload half way
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-toolchain:
    timeout-minutes: 20
    runs-on: hetzner-runner
    container:
      image: ubuntu:22.04
      options: --volume /var/run/docker.sock:/var/run/docker.sock

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y s3cmd docker.io

      - name: Build conversion toolchain image
        run: bash onnxruntime/conversion-toolchain/build-toolchain.sh

      - name: Publish to the OAAX bucket
        uses: ./.github/actions/publish
        with:
          set: ort-toolchain
          s3-access-key: ${{ secrets.S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.S3_SECRET_KEY }}
          s3-endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
