[project]
name = "oaax-nvidia-tensorrt-conversion"
dynamic = ["version"]
description = "OAAX conversion toolchain — compiles an ONNX model into a TensorRT engine"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pillow",
    "onnx",
    "onnxconverter-common",
]

# Precision extras — install the one matching your TRT version:
#   TRT 10 int8:  pip install "pkg[int8-trt10]" --extra-index-url https://pypi.nvidia.com
#   TRT 11 int8:  pip install "pkg[int8-trt11]" --extra-index-url https://pypi.nvidia.com
#   TRT 11 fp16:  onnxconverter-common is included in base deps
[project.optional-dependencies]
int8-trt10 = ["tensorrt", "pycuda"]
int8-trt11 = ["nvidia-modelopt[onnx]"]

[project.scripts]
conversion_toolchain = "conversion_toolchain.main:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "conversion_toolchain.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["conversion_toolchain*"]
